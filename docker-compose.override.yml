# Local development overrides. Docker Compose loads this file automatically
# alongside docker-compose.yml when using `docker compose up`.
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"

  web:
    command: npm run dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"
